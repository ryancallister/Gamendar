services:
  gamendar:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gamendar
    restart: unless-stopped
    environment:
      # Optional: leave unset and one is generated into ./data/secret_key
      - SECRET_KEY=${SECRET_KEY:-}
      - DATABASE_PATH=/data/calendar.db
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
    volumes:
      - ./data:/data
    ports:
      - "${APP_PORT:-3005}:5000"
