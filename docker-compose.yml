services:
  gamendar:
    build: ./backend
    container_name: gamendar
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_PATH=/data/calendar.db
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
    volumes:
      - ./data:/data
    ports:
      - "${APP_PORT:-3005}:5000"
